android.useAndroidX=true
# Single-module app: R always resolves to this package's own class, so
# skipping the per-classpath R lookups speeds resource linking slightly.
android.nonTransitiveRClass=true

# Build-time only - no effect on the app itself. The native (CMake) build and
# the ~30MB multi-language data archive make clean builds slow enough that
# caching/heap tuning meaningfully help repeated local and CI builds.
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3072m
# Reuses the configuration phase across invocations (and CI cache restores):
# this build's config block (afterEvaluate task wiring, checksum plugin,
# externalNativeBuild setup) is nontrivial and otherwise re-runs every time.
org.gradle.configuration-cache=true
# Single project, so parallel only overlaps independent task graphs
# (native build + resource tasks); harmless if there is nothing to split.
org.gradle.parallel=true
