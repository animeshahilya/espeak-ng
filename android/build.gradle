buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        // createPackedAssets: zstd-compresses the dictionaries and data/ put in the APK
        classpath 'com.github.luben:zstd-jni:1.5.7-6'
    }
}
plugins {
    id 'org.gradle.crypto.checksum' version '1.4.0'
}

import org.gradle.crypto.checksum.Checksum
apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

// Release signing - keystore.properties and the .jks it points to are both
// gitignored. Without it, assembleRelease still produces an unsigned APK
// rather than failing, matching the debug/lint/test flow this file already
// supports with no keystore present.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}


// AGP's built-in Kotlin support pulls in kotlin-stdlib as a runtime
// dependency of every com.android.application project by default, even one
// with zero .kt files (compileDebugKotlin is NO-SOURCE here) - this app is
// plain Java throughout, and nothing packaged ever references it. Excluding
// it project-wide via configurations.configureEach also strips it from
// AGP's own internal lint tooling classpath, which needs kotlin-stdlib to
// run at all (broke lintVitalRelease/assembleRelease with a
// kotlin/enums/EnumEntriesKt NoClassDefFoundError) - so this only targets
// the app variants' own runtime classpaths by exact name, not every
// configuration in the project.
//
// GATE 0 NOTE (AndroidX migration spike): androidx.appcompat is partially
// Kotlin - AppCompatActivity crashes at class-load without stdlib
// (ClassNotFoundException: kotlin.jvm.internal.Intrinsics, verified
// on-device). The exclusion is lifted while the spike lives; if the
// migration goes ahead it stays lifted, and the APK delta below must be
// re-measured with stdlib included.
//configurations.matching { it.name ==~ /(debug|release)RuntimeClasspath/ }.all {
//    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
//}

dependencies {
    // Gate 0 spike for the AndroidX preference migration (see
    // ANDROIDX_MIGRATION_PLAN.md). Pinned 1.2.1: latest stable 1.x line.
    implementation 'androidx.preference:preference:1.2.1'
    // Preference pulls in activity 1.5.1, which predates the system's
    // OnBackInvokedDispatcher: at targetSdk 36+ the Back key then bypasses
    // TtsSettingsActivity's OnBackPressedCallback, so Back in a sub-screen
    // left the app instead of returning to the main list. 1.6+ bridges it.
    implementation 'androidx.activity:activity:1.13.0'
    // Preference 1.2.1 (its last release) still pulls Fragment 1.5.4 from
    // 2022; the settings dialogs are DialogFragments, so take 1.8's fixes.
    implementation 'androidx.fragment:fragment:1.8.9'
    // Material 3 (Material You) styling for the settings UI: M3 theme parent,
    // MaterialAlertDialogBuilder dialogs, TextInputLayout fields and dynamic
    // color. 1.14.0 adds keyboard support to the exposed dropdowns (voice
    // variant and user dictionary dialogs).
    implementation 'com.google.android.material:material:1.14.0'
    // User-dictionary regex rules run on RE2/J: linear time whatever the
    // pattern, so an imported rule can never freeze speech (Android's regex
    // engine backtracks and cannot be interrupted). Pure Java, BSD-style.
    implementation 'com.google.re2j:re2j:1.8'
    // Piper natural voices: ONNX Runtime runs the VITS models on the CPU.
    // A full (not "minimal") build: Piper models are plain ONNX files from
    // the voice catalog, optimized on the phone. Only arm64-v8a ships.
    // ONNX Runtime 1.30.0 built for this app by tools/ort-voices/build.sh:
    // arm64 only, only the operators the natural voices use, no
    // NNAPI/XNNPACK/WebGPU/telemetry - libonnxruntime.so 16 MB instead of
    // Microsoft's 33 (APK 34.7 -> 28.4 MB). Both APKs use it.
    implementation files('libs/onnxruntime-voices-1.30.0.aar')
    // -Psnapdragon builds the Snapdragon APK: Qualcomm's QNN plugin for ONNX
    // Runtime (loaded at run time, PiperModel.npuDevices) and the QNN runtime
    // it was built with (QAIRT 2.50), so natural-voice decoders run on the
    // Hexagon NPU (PiperModel.attachNpu; ~22x real time vs ~4x on a Galaxy
    // S25 Ultra's CPU). It adds ~60 MB, hence a separate APK.
    if (project.hasProperty('snapdragon')) {
        implementation 'com.qualcomm.qti:onnxruntime-android-qnn:2.6.0'
        implementation 'com.qualcomm.qti:qnn-runtime:2.50.0'
    }
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for the JVM unit tests: android.jar's is a stub, and
    // returnDefaultValues would make every Piper config parse come back empty.
    testImplementation 'org.json:json:20250517'
    // Desktop ICU: checks the bundled CLDR number rules (data/numbers/) parse
    // and read right; android.jar's android.icu is a stub on the JVM.
    testImplementation 'com.ibm.icu:icu4j:78.3'
    androidTestImplementation 'org.hamcrest:hamcrest:2.2'
    androidTestImplementation 'org.hamcrest:hamcrest-core:2.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

android {
    compileSdk = 36
    ndkVersion = "30.0.16248370"
    namespace = "com.animeshahilya.espeakng"

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // The Snapdragon APK: Qualcomm's QNN plugin needs API 27. It is only
        // offered from the Snapdragon 8 Gen 1 on, which shipped with Android 12.
        minSdk = project.hasProperty('snapdragon') ? 27 : 26
        targetSdk = 36
        versionCode = 34
        versionName = "2.10 beta 2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        // PiperModel.hasNpuRuntime: known here, so the standard build never
        // loads ONNX Runtime just to ask (it did on every settings open).
        buildConfigField "boolean", "SNAPDRAGON", project.hasProperty('snapdragon') ? "true" : "false"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // USE_KLATT is upstream's default, but spelled out: the
                // Klatt 1-6 voice variants ship in this app and need it.
                // (No USE_MBROLA flag: MBROLA support was removed entirely,
                // there is no such CMake option anymore.)
                arguments.addAll(["-DUSE_ASYNC:BOOL=OFF", "-DUSE_LIBSONIC:BOOL=ON", "-DUSE_KLATT:BOOL=ON"])
                abiFilters.addAll(["arm64-v8a"])
                targets.addAll(["ttsespeak", "espeak-data"])
            }
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            // Safe now that proguard-rules.pro explicitly keeps SpeechSynthesis whole -
            // see that file for why (JNI binds to it by exact name, with no Java-side
            // call site for two of its methods). Don't remove that rule without also
            // reverting this, and always verify a release build's TTS synthesis on a
            // real device after touching either.
            minifyEnabled = true
            // shrinkResources requires minifyEnabled (satisfied above) and is safe here:
            // the app has no Resources.getIdentifier() dynamic lookups (checked - none),
            // which is the usual way resource shrinking silently breaks an app. The bulk
            // of the app's size (res/raw/espeakdata.zip, the 153-language data archive)
            // is a single generated binary asset this doesn't touch either way - this
            // only prunes genuinely unreferenced drawables/layouts/values.
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path = "jni/CMakeLists.txt"
            // Pinned to the version shipped in the SDK on dev machines and CI
            // (3.22.1): AGP requires an exact installed match, so "newer"
            // pins break the build wherever that version isn't installed.
            version = "3.22.1"
        }
    }

    sourceSets {
        main {
            manifest.srcFile('AndroidManifest.xml')
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test/src']
            resources.srcDirs = ['test/resources']
        }
        androidTest {
            java.srcDirs = ['eSpeakTests/src']
            res.srcDirs = ['eSpeakTests/res']
        }
    }

    // Compressed native libraries: ONNX Runtime (Piper natural voices) is a
    // 16 MB .so (our own slim build); stored uncompressed the APK people
    // download from Releases would grow ~10 MB (23 -> 33 MB). Compressed it
    // costs ~6 MB; the price is one extraction at install time (~17 MB on
    // the phone). Revisit if the app moves to app bundles (Play splits and
    // compresses per device anyway).
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // The Snapdragon APK uses QNN's HTP (NPU) backend only, and is only
            // offered from the SM8450 (HTP v69) on: drop the GPU and DSP
            // backends and the v68 NPU libraries (~10 MB of the APK, ~26 MB
            // installed).
            excludes += ['**/libQnnGpu.so', '**/libQnnDsp.so', '**/libQnnDspV*.so',
                         '**/libQnnHtpV68Skel.so', '**/libQnnHtpV68Stub.so']
        }
    }

    // Already compressed (espeakdata.zip, the zstd assets of createPackedAssets);
    // .zst is also kept stored so the engine maps it instead of inflating a copy
    androidResources {
        noCompress += ["espeakdata.zip", "zst"]
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
        // JVM tests read data/ straight from the source tree: without this a
        // data-only change left them UP-TO-DATE, never rerun.
        unitTests.all { it.inputs.dir("data").withPathSensitivity(PathSensitivity.RELATIVE) }
    }

    lint {
        abortOnError = false
        // AGP's lint tool crashes parsing JavaDoc in the upstream-copied
        // eSpeak Android .java files under this detector (not a real
        // finding) - see BidirectionalTextDetector in the crash trace.
        disable += "BidiSpoofing"
        disable += "MissingTranslation"
    }
}

tasks.register('checkData') {
    // Resolve once at configuration time: checkData's doFirst must not call
    // Project.file() at execution time (unsupported with the configuration
    // cache), and File values are serializable into the cache entry.
    def generatedDataDir = file('build/generated/espeak-ng-data')
    doFirst {
        // Assert on the generated tree, not the source tree: createDataArchive
        // zips build/generated/espeak-ng-data/, and the ../espeak-ng-data
        // sources only ever hold lang/ and voices/ (asserting on them failed
        // every fresh-clone build).
        ['en_dict', 'intonations', 'phondata', 'phondata-manifest',
         'phonindex', 'phontab'].each { name ->
            assert new File(generatedDataDir, name).exists(): "missing ${name} in ${generatedDataDir}"
        }
    }
}

// Every language espeak-ng-data ships (all 153) goes straight into the APK
// - there is no core/extra split and no separate downloadable pack. This
// costs roughly 30MB versus the ~3MB a previous English/Indic/Dravidian-only
// bundle used, traded for every language working offline immediately with
// no "download more languages" step.
//
// Generated res/ files live under build/generated/ and reach aapt through
// the sourceSets roots above - never written into the source tree, so builds
// leave `git status` clean and cannot accidentally commit a stale 0.5 MB zip.
tasks.register('createDataArchive', Zip) {
    dependsOn tasks.checkData
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    archiveFileName = "espeakdata.zip"
    destinationDirectory.set(layout.buildDirectory.dir("generated/espeak-res/raw"))

    from("build/generated/espeak-ng-data/") {
        into "espeak-ng-data"
        // Compiled dictionaries (~30 MB of the 30.7) are not extracted: the
        // engine reads them from the APK's assets (createPackedAssets).
        exclude "*_dict"
    }
}

// Everything the app reads but never changes is stored zstd-compressed (level
// 19) in the APK and unpacked by the engine's zstd decoder, through one path:
// - every compiled dictionary, espeak-dicts/<name>_dict.zst (14.1 MB of zip
//   deflate -> 11.0 MB), read when a language first needs it
//   (espeak_SetDictionaryReader in jni/jni/eSpeakService.c), never copied into
//   app storage;
// - the text data in android/data/ (NVDA symbols, character descriptions and
//   emoji names, Hinglish, number words), data/<path>.zst, read by
//   text/BundledData.
// .zst is kept stored (noCompress), so the engine maps it instead of inflating
// a copy. Registered through the variant API, which wires the asset tasks'
// dependencies.
abstract class PackedAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getDictDir()

    @InputDirectory
    abstract DirectoryProperty getTextDir()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @javax.inject.Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void run() {
        def out = outputDir.get().asFile
        fs.delete { delete out }
        def pack = { File from, File to ->
            to.parentFile.mkdirs()
            to.bytes = com.github.luben.zstd.Zstd.compress(from.bytes, 19)
        }
        def dicts = new File(out, "espeak-dicts")
        dicts.mkdirs()
        dictDir.get().asFile.listFiles().findAll { it.name.endsWith("_dict") }.each { f ->
            pack(f, new File(dicts, f.name + ".zst"))
        }
        def text = textDir.get().asFile
        text.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def rel = text.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, (char) '/')
            pack(f, new File(out, "data/" + rel + ".zst"))
        }
    }
}

def packedAssets = tasks.register('createPackedAssets', PackedAssets) {
    dependsOn tasks.checkData
    dictDir = file("build/generated/espeak-ng-data")
    textDir = file("data")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(packedAssets) { it.outputDir }
        // Build-generated raw resources (createDataArchive, createDataVersion):
        // static roots (they only ever hold generated files) with ordering
        // from the explicit edges below.
        variant.sources.res?.addStaticSourceDirectory("build/generated/espeak-res")
        variant.sources.res?.addStaticSourceDirectory("build/generated/espeak-version")
    }
}

tasks.register('createDataHash', Checksum) {
    dependsOn tasks.createDataArchive
    checksumAlgorithm.set(Checksum.Algorithm.SHA256)
    inputFiles.setFrom(layout.buildDirectory.file("generated/espeak-res/raw/espeakdata.zip"))
    outputDirectory.set(layout.buildDirectory.dir('intermediates/datahash'))
}

tasks.register('createDataVersion', Copy) {
    dependsOn tasks.createDataHash
    from layout.buildDirectory.file('intermediates/datahash/espeakdata.zip.sha256')
    rename { return 'espeakdata_version' }
    into layout.buildDirectory.dir("generated/espeak-version/raw")
}

project.afterEvaluate {
    // build/generated/espeak-ng-data/ is produced by the native build's
    // espeak-data target (always re-run: it declares no outputs), so the
    // data tasks follow the native build of every variant being built.
    // checkData carries the edge; createDataArchive and createPackedAssets
    // follow it transitively. The old single-heuristic pick built the wrong
    // variant for `assembleDebug assembleRelease` and for release testing.
    def names = gradle.startParameter.taskNames.join(' ').toLowerCase()
    if (names.contains("release") && tasks.findByName('externalNativeBuildRelease') != null) {
        tasks.checkData.dependsOn('externalNativeBuildRelease')
    }
    if (!names.contains("release") || names.contains("debug")) {
        tasks.checkData.dependsOn('externalNativeBuildDebug')
    }
    // Ordering for the generated res/ roots above (visibility comes from the
    // sourceSets): every task that reads or packages resources runs after
    // the files exist. One list, debug and release alike - the old
    // whenTaskAdded twin of this (assemble -> createDataVersion) is gone.
    ['mapDebugSourceSetPaths', 'generateDebugResources', 'processDebugNavigationResources',
     'mergeDebugResources', 'packageDebugResources',
     'mapReleaseSourceSetPaths', 'generateReleaseResources', 'processReleaseNavigationResources',
     'mergeReleaseResources', 'packageReleaseResources'].each { name ->
        tasks.named(name) {
            dependsOn ':createDataVersion', ':createDataArchive'
        }
    }
}

// The Snapdragon build (see the onnxruntime dependency) is its own APK file.
if (project.hasProperty('snapdragon')) {
    base {
        archivesName = 'espeak-snapdragon'
    }
}
